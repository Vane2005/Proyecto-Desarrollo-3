<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>VivaEventos - Pago</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="css/materialize.css" type="text/css" rel="stylesheet" media="screen,projection"/>
    <link href="css/style.css" type="text/css" rel="stylesheet" media="screen,projection"/>
    <style>
        .pay-card {
            background: #1e1030;
            border-radius: 16px;
            border: 1px solid rgba(180,120,255,0.2);
            max-width: 560px;
            margin: 2.5rem auto;
            padding: 2rem 2.2rem;
        }
        .pay-card h5 { color: #f3e8ff; font-weight: 600; margin: 0 0 0.3rem; }
        .pay-card .subtitle { color: #a98ecf; font-size: 0.9rem; margin-bottom: 1.8rem; }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(180,120,255,0.08);
            color: #c4a4f0;
            font-size: 0.92rem;
        }
        .summary-row span:last-child { color: #f3e8ff; font-weight: 500; }
        .summary-row.total { border-bottom: none; margin-top: 0.4rem; font-size: 1.05rem; }
        .summary-row.total span:last-child { color: #b47fff; font-size: 1.2rem; font-weight: 700; }
        .ticket-select { margin: 1.4rem 0; }
        .ticket-select label { color: #a98ecf !important; }
        .ticket-select select { color: #f3e8ff !important; background: #2a1545 !important; }
        .qty-row { display: flex; align-items: center; gap: 1rem; margin: 1rem 0 1.6rem; }
        .qty-row label { color: #a98ecf; font-size: 0.9rem; flex: 1; }
        .qty-row input[type=number] {
            width: 80px; background: #2a1545; border: 1px solid rgba(180,120,255,0.2);
            border-radius: 8px; color: #f3e8ff; padding: 0.4rem 0.7rem; font-size: 1rem;
        }
        .btn-pay {
            width: 100%; background: #7c3aed; border-radius: 10px;
            padding: 0.9rem; font-size: 1rem; font-weight: 600;
            letter-spacing: 0.3px; margin-top: 1rem;
        }
        .btn-pay:hover { background: #6d28d9; }
        .state-box { text-align: center; padding: 2rem 0; color: #a98ecf; }
        .state-box .material-icons { font-size: 2.8rem; display: block; margin-bottom: 0.8rem; }
        .wompi-badge {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; color: #6b7280; font-size: 0.78rem; margin-top: 1.2rem;
        }
        .wompi-badge .material-icons { font-size: 1rem; }
        #step-result { display: none; }
        .result-icon-ok { color: #22c55e; font-size: 4rem !important; }
        .result-icon-fail { color: #ef4444; font-size: 4rem !important; }
    </style>
</head>
<body>
<nav role="navigation">
    <div class="nav-wrapper container">
        <a href="home.html" class="brand-logo white-text">VivaEventos</a>
        <ul class="right hide-on-med-and-down">
            <li><a href="home.html" class="white-text"><i class="material-icons left">arrow_back</i>Volver</a></li>
        </ul>
    </div>
</nav>

<div class="container">

    <!-- PASO 1: Formulario de compra -->
    <div id="step-form">
        <div class="pay-card">
            <h5>Finalizar compra</h5>
            <p class="subtitle">Seleccioná el tipo de boleta y la cantidad</p>

            <!-- Selector de tipo de boleta -->
            <div class="ticket-select input-field">
                <select id="ticket-type-select" onchange="onTicketChange()">
                    <option value="" disabled selected>Cargando tipos de boleta...</option>
                </select>
                <label>Tipo de boleta</label>
            </div>

            <!-- Cantidad -->
            <div class="qty-row">
                <label for="qty">Cantidad</label>
                <input type="number" id="qty" min="1" max="10" value="1" onchange="calcTotal()"/>
            </div>

            <!-- Resumen de precio -->
            <div id="price-summary" style="display:none">
                <div class="summary-row">
                    <span>Precio unitario</span>
                    <span id="unit-price-label">—</span>
                </div>
                <div class="summary-row">
                    <span>Cantidad</span>
                    <span id="qty-label">—</span>
                </div>
                <div class="summary-row total">
                    <span>Total a pagar</span>
                    <span id="total-label">—</span>
                </div>
            </div>

            <button class="btn btn-pay waves-effect waves-light" onclick="iniciarPago()">
                <i class="material-icons left">lock</i>Pagar ahora
            </button>

            <div class="wompi-badge">
                <i class="material-icons">security</i>
                Pago seguro procesado por Wompi
            </div>
        </div>
    </div>

    <!-- PASO 2: Procesando -->
    <div id="step-loading" style="display:none">
        <div class="pay-card">
            <div class="state-box">
                <div class="preloader-wrapper active">
                    <div class="spinner-layer spinner-purple-only">
                        <div class="circle-clipper left"><div class="circle"></div></div>
                        <div class="gap-patch"><div class="circle"></div></div>
                        <div class="circle-clipper right"><div class="circle"></div></div>
                    </div>
                </div>
                <p style="margin-top:1.2rem">Procesando tu orden...</p>
            </div>
        </div>
    </div>

    <!-- PASO 3: Resultado (sandbox o vuelta de Wompi) -->
    <div id="step-result">
        <div class="pay-card">
            <div class="state-box" id="result-content"></div>
        </div>
    </div>

</div>

<script src="js/materialize.js"></script>
<script>
    const ORDER_SERVICE_URL   = 'http://localhost:8083';
    const PAYMENT_SERVICE_URL = 'http://localhost:8084';

    const token   = localStorage.getItem('token');
    const userId  = localStorage.getItem('userId');   // guardado al hacer login
    const userEmail = localStorage.getItem('userEmail');
    const eventId = localStorage.getItem('selectedEventId');

    if (!token) window.location.href = 'login.html';

    let ticketTypes = [];
    let selectedTicket = null;

    // ── Inicializar ──────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
        M.FormSelect.init(document.querySelectorAll('select'));
        await cargarTicketTypes();

        // ¿Viene de redirect de Wompi?
        const params = new URLSearchParams(window.location.search);
        const txStatus = params.get('status') || params.get('transaction_status');
        if (txStatus) mostrarResultado(txStatus);
    });

    // ── Cargar tipos de boleta desde el event-service ────────────
    async function cargarTicketTypes() {
        try {
            const res = await fetch(
                `http://localhost:8082/api/v1/events/${eventId}`,
                { headers: { 'Authorization': `Bearer ${token}` } }
            );
            if (!res.ok) throw new Error();
            const evento = await res.json();
            ticketTypes = evento.ticketTypes || [];

            const select = document.getElementById('ticket-type-select');
            select.innerHTML = '<option value="" disabled selected>Seleccioná un tipo</option>';
            ticketTypes.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = `${t.type} — $${Number(t.price).toLocaleString('es-CO')}`;
                select.appendChild(opt);
            });
            M.FormSelect.init(select);
        } catch {
            M.toast({ html: 'No se pudieron cargar los tipos de boleta', classes: 'red darken-3' });
        }
    }

    function onTicketChange() {
        const selectEl = document.getElementById('ticket-type-select');
        const id = selectEl.value;
        selectedTicket = ticketTypes.find(t => t.id === id) || null;
        document.getElementById('price-summary').style.display = selectedTicket ? 'block' : 'none';
        calcTotal();
    }

    function calcTotal() {
        if (!selectedTicket) return;
        const qty = parseInt(document.getElementById('qty').value) || 1;
        const unit = Number(selectedTicket.price);
        document.getElementById('unit-price-label').textContent = `$${unit.toLocaleString('es-CO')}`;
        document.getElementById('qty-label').textContent = qty;
        document.getElementById('total-label').textContent = `$${(unit * qty).toLocaleString('es-CO')}`;
    }

    function toUUID(id) {
        if (!id) return null;
        // Si ya es UUID válido, lo devuelve tal cual
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) return id;
        // Si es número, lo convierte a UUID formato 00000000-0000-0000-0000-000000000002
        const padded = String(id).padStart(12, '0');
        return `00000000-0000-0000-0000-${padded}`;
    }

    // ── Flujo principal ──────────────────────────────────────────
    async function iniciarPago() {
        if (!selectedTicket) {
            M.toast({ html: 'Seleccioná un tipo de boleta', classes: 'orange darken-3' });
            return;
        }
        const qty = parseInt(document.getElementById('qty').value) || 1;
        if (qty < 1 || qty > 10) {
            M.toast({ html: 'Cantidad inválida (1-10)', classes: 'orange darken-3' });
            return;
        }

        mostrarPaso('loading');

        try {
            // 1. Crear orden
            const orderRes = await fetch(`${ORDER_SERVICE_URL}/api/v1/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    'X-User-Id': toUUID(userId) || '00000000-0000-0000-0000-000000000001'
                },
                body: JSON.stringify({
                    eventId: eventId,
                    ticketTypeId: selectedTicket.id,
                    quantity: qty,
                    customerEmail: userEmail
                })
            });

            if (!orderRes.ok) {
                const err = await orderRes.text();
                throw new Error(`Error creando orden: ${err}`);
            }
            const order = await orderRes.json();
            localStorage.setItem('lastOrderId', order.id);

            // 2. Iniciar pago
            const payRes = await fetch(`${PAYMENT_SERVICE_URL}/api/v1/payments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ orderId: order.id })
            });

            if (!payRes.ok) {
                const errorJson = await payRes.json();

                console.error(errorJson);

                throw new Error(errorJson.detail || 'Error iniciando pago');
            }
            const payment = await payRes.json();

            // Redirección real a Wompi
            if (payment.checkoutUrl && !payment.checkoutUrl.includes('sandbox-local')) {
                window.location.href = payment.checkoutUrl;
            } else {

                if (payment.status === 'APROBADO') {
                    mostrarResultado('APPROVED');
                } else if (payment.status === 'FALLIDO') {
                    mostrarResultado('FAILED', payment.failureReason);
                } else {
                    mostrarResultado(
                        'PENDING',
                        'Tu pago se encuentra en proceso de validación.'
                    );
                }
            }

        } catch (err) {
            console.error(err);
            mostrarResultado('FAILED', err.message);
        }
    }

    // ── UI helpers ────────────────────────────────────────────────
    function mostrarPaso(paso) {
        document.getElementById('step-form').style.display    = paso === 'form'    ? 'block' : 'none';
        document.getElementById('step-loading').style.display = paso === 'loading' ? 'block' : 'none';
        document.getElementById('step-result').style.display  = paso === 'result'  ? 'block' : 'none';
    }

    function mostrarResultado(status, detalle) {
        mostrarPaso('result');
        if (status === 'PENDING') {

            document.getElementById('result-content').innerHTML = `
        <i class="material-icons" style="color:#f59e0b;font-size:4rem">
            schedule
        </i>

        <h5 style="color:#f59e0b">
            Pago en proceso
        </h5>

        <p style="color:#a98ecf">
            ${detalle || 'Estamos validando tu transacción.'}
        </p>

        <a href="home.html"
           class="btn purple darken-3 waves-effect"
           style="margin-top:1.5rem">
           Volver
        </a>
    `;

            return;
        }
        const aprobado = status === 'APPROVED' || status === 'approved';
        document.getElementById('result-content').innerHTML = aprobado
            ? `
          <i class="material-icons result-icon-ok">check_circle</i>
          <h5 style="color:#22c55e;margin:0 0 0.5rem">¡Pago exitoso!</h5>
          <p style="color:#a98ecf">Tu boleta fue confirmada. Recibirás un correo con los detalles.</p>
          <a href="home.html" class="btn purple darken-3 waves-effect" style="margin-top:1.5rem">
            <i class="material-icons left">event</i>Ver más eventos
          </a>
        `
            : `
          <i class="material-icons result-icon-fail">cancel</i>
          <h5 style="color:#ef4444;margin:0 0 0.5rem">Pago no procesado</h5>
          <p style="color:#a98ecf">${detalle || 'Ocurrió un problema con el pago. Intentá de nuevo.'}</p>
          <a href="pago.html" class="btn purple darken-3 waves-effect" style="margin-top:1.5rem">
            Reintentar
          </a>
        `;
    }
</script>
</body>
</html>
